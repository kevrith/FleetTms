name: CI
on: [push, pull_request]
jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @fleettms/web build
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - name: Start Postgres (PostGIS + TimescaleDB)
        working-directory: .
        run: |
          PGPASS=$(openssl rand -hex 16)
          echo "::add-mask::$PGPASS"
          echo "DATABASE_URL=postgresql+asyncpg://fleettms:${PGPASS}@localhost:5432/fleettms" >> "$GITHUB_ENV"
          docker run -d --name db -p 5432:5432 -e POSTGRES_USER=fleettms -e POSTGRES_PASSWORD="$PGPASS" -e POSTGRES_DB=fleettms timescale/timescaledb-ha:pg16
          for i in $(seq 1 30); do docker exec db pg_isready -U fleettms && break; sleep 2; done
      - uses: actions/setup-python@v5
        with:
          {
            python-version: "3.12",
            cache: pip,
            cache-dependency-path: apps/api/requirements-dev.txt,
          }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Python packages with known vulnerabilities (blocks)
        run: |
          pip install pip-audit
          pip-audit -r apps/api/constraints.txt --no-deps --disable-pip
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # The known findings are in the phone app's build tooling and are explained in docs/security-review.md, so this reports but does not block.
      - name: Node packages with known vulnerabilities (reports)
        run: pnpm audit --prod || true
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The API image builds
        run: docker build -f deploy/api.Dockerfile -t fleettms-api apps/api
      - name: The web and proxy image builds
        run: docker build -f deploy/web.Dockerfile --build-arg VITE_API_URL=https://api.example.com -t fleettms-edge .
