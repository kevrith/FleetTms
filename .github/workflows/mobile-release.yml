name: Mobile Release

# Builds the Android app on GitHub's own runners with the EAS CLI (--local), signed with the key EAS holds for this project, and
# publishes the APK to the "mobile-latest" release so drivers have one stable download link.
#
#   git tag mobile-v0.1.0 && git push --tags      (or run it by hand from the Actions tab)
#
# Needs the repository secret EXPO_TOKEN (expo.dev > Account settings > Access tokens). Nothing else is stored here.

on:
  push:
    tags:
      - "mobile-v*"
  workflow_dispatch:

permissions:
  contents: write # creates and updates the mobile-latest release

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "@fleettms/mobile..."

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build the APK
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::The EXPO_TOKEN repository secret is not set."
            exit 1
          fi
          mkdir -p build
          # Always the preview profile: an installable APK that talks to the hosted API. The production profile makes an app bundle for
          # the Play Store, which a phone cannot install, so it is never published here.
          eas build --platform android --profile preview --local --output ./build/fleettms.apk --non-interactive
          if ! unzip -l build/fleettms.apk | grep -q " AndroidManifest.xml$"; then
            echo "::error::The build is not an installable APK (an app bundle has no AndroidManifest.xml at its root)."
            exit 1
          fi

      - name: Keep the APK with the run
        uses: actions/upload-artifact@v4
        with:
          name: fleettms-android-${{ github.ref_name }}
          path: apps/mobile/build/fleettms.apk
          retention-days: 30

      # Created only when missing and then overwritten asset by asset, so a failed run never leaves the download link empty.
      - name: Publish to the mobile-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh release view mobile-latest --repo "$REPO" >/dev/null 2>&1 || gh release create mobile-latest \
            --repo "$REPO" --title "FleetTms Android: latest build" --notes "Built by the Mobile Release workflow." --latest=false
          gh release upload mobile-latest apps/mobile/build/fleettms.apk --repo "$REPO" --clobber
          gh release edit mobile-latest --repo "$REPO" --notes "Direct download: https://github.com/$REPO/releases/download/mobile-latest/fleettms.apk
          Built from commit ${GITHUB_SHA::7} (${GITHUB_REF_NAME}). Run: $RUN_URL
          Install it on an Android phone, allowing installs from your browser or file manager if asked."
