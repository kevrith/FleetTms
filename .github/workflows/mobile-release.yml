name: Mobile Release

# Builds the Android app on GitHub's own runners with the EAS CLI (--local), signed with the key EAS holds for this project, and
# publishes the APK to the "mobile-latest" release so drivers have one stable download link.
#
#   git tag mobile-v0.1.0 && git push --tags      (or run it by hand from the Actions tab)
#
# Needs the repository secret EXPO_TOKEN (expo.dev > Account settings > Access tokens). Nothing else is stored here.

on:
  push:
    tags:
      - "mobile-v*"
  workflow_dispatch:
    inputs:
      notes:
        description: "What changed, in a sentence a driver can read (shown on the Update button). Empty uses the last commit's title."
        required: false

permissions:
  contents: write # creates and updates the mobile-latest release

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "@fleettms/mobile..."

      - name: Install EAS CLI
        run: npm install -g eas-cli

      # Firebase's Android config is not in the repository. Put the whole contents of the downloaded google-services.json in the repository
      # secret GOOGLE_SERVICES_JSON; it is written to the file the build reads (apps/mobile/app.config.js). Without it the APK still builds,
      # just without push alerts on Android, and the run says so.
      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_CONTENT" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_CONTENT" > apps/mobile/google-services.json
          else
            echo "::warning::The GOOGLE_SERVICES_JSON repository secret is not set, so this APK has no Android push alerts."
          fi

      - name: Build the APK
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::The EXPO_TOKEN repository secret is not set."
            exit 1
          fi
          mkdir -p build
          # Always the preview profile: an installable APK that talks to the hosted API. The production profile makes an app bundle for
          # the Play Store, which a phone cannot install, so it is never published here.
          eas build --platform android --profile preview --local --output ./build/fleettms.apk --non-interactive
          if ! unzip -l build/fleettms.apk | grep -q " AndroidManifest.xml$"; then
            echo "::error::The build is not an installable APK (an app bundle has no AndroidManifest.xml at its root)."
            exit 1
          fi

      # latest.json is what the app reads to offer an Update button: the build's real version code (read from the APK itself, because EAS
      # numbers the builds), a checksum and size, and the notes. It is published only after the APK, so it never points at a missing file.
      - name: Describe the build
        env:
          NOTES_INPUT: ${{ github.event.inputs.notes }}
          REPO: ${{ github.repository }}
        run: |
          APK=apps/mobile/build/fleettms.apk
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          BADGING=$("$AAPT2" dump badging "$APK")
          CODE=$(echo "$BADGING" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          NAME=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
          [ -n "$CODE" ] && [ -n "$NAME" ] || { echo "::error::Could not read the version from the APK."; exit 1; }
          NOTES="${NOTES_INPUT:-$(git log -1 --pretty=%s)}"
          python3 - "$APK" "$CODE" "$NAME" "$NOTES" <<'PY'
          import hashlib, json, os, sys
          apk, code, name, notes = sys.argv[1:5]
          with open(apk, "rb") as f:
              digest = hashlib.md5(f.read()).hexdigest()
          json.dump({
              "version": name, "version_code": int(code), "md5": digest, "size_bytes": os.path.getsize(apk), "notes": notes[:300],
              "apk_url": f"https://github.com/{os.environ['REPO']}/releases/download/mobile-latest/fleettms.apk",
              "commit": os.environ.get("GITHUB_SHA", ""),
          }, open("apps/mobile/build/latest.json", "w"), indent=2)
          PY
          cat apps/mobile/build/latest.json

      - name: Keep the APK with the run
        uses: actions/upload-artifact@v4
        with:
          name: fleettms-android-${{ github.ref_name }}
          path: apps/mobile/build/fleettms.apk
          retention-days: 30

      # Created only when missing and then overwritten asset by asset, so a failed run never leaves the download link empty.
      - name: Publish to the mobile-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh release view mobile-latest --repo "$REPO" >/dev/null 2>&1 || gh release create mobile-latest \
            --repo "$REPO" --title "FleetTms Android: latest build" --notes "Built by the Mobile Release workflow." --latest=false
          gh release upload mobile-latest apps/mobile/build/fleettms.apk --repo "$REPO" --clobber
          gh release upload mobile-latest apps/mobile/build/latest.json --repo "$REPO" --clobber
          gh release edit mobile-latest --repo "$REPO" --notes "Direct download: https://github.com/$REPO/releases/download/mobile-latest/fleettms.apk
          Built from commit ${GITHUB_SHA::7} (${GITHUB_REF_NAME}). Run: $RUN_URL
          Install it on an Android phone, allowing installs from your browser or file manager if asked."
