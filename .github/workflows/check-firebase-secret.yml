name: Check Firebase secret

# Run by hand from the Actions tab. Checks that the GOOGLE_SERVICES_JSON repository secret is a usable google-services.json for the
# Android app. Prints pass or fail only, never the values.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check GOOGLE_SERVICES_JSON
    runs-on: ubuntu-latest
    steps:
      - name: Check the secret
        env:
          GOOGLE_SERVICES_JSON_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_CONTENT" ]; then
            echo "::error::The GOOGLE_SERVICES_JSON secret is not set."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_CONTENT" > google-services.json
          python3 - <<'PY'
          import json, sys
          problems = []
          try:
              data = json.load(open("google-services.json"))
          except Exception as e:
              raw = open("google-services.json", "rb").read()
              first = raw.lstrip()[:1]
              nl, bom, esc, quote = b"\n", b"\xef\xbb\xbf", b"\\n", b'"'
              print("::error::Not valid JSON: %s at line %s column %s." % (getattr(e, "msg", type(e).__name__), getattr(e, "lineno", "?"), getattr(e, "colno", "?")))
              print("::error::Stored value: %d bytes, %d line breaks, starts with a brace: %s, has a byte order mark: %s, has backslash-n text: %s, wrapped in quotes: %s." % (len(raw), raw.count(nl), first == b"{", raw.startswith(bom), esc in raw, first == quote))
              sys.exit(1)
          info = data.get("project_info", {})
          for key in ("project_number", "project_id"):
              if not info.get(key): problems.append(f"project_info.{key} is missing")
          clients = [c for c in data.get("client", []) if c.get("client_info", {}).get("android_client_info", {}).get("package_name") == "com.kastra.fleettms"]
          if not clients:
              problems.append("no client with package com.kastra.fleettms")
          else:
              c = clients[0]
              if not c["client_info"].get("mobilesdk_app_id"): problems.append("mobilesdk_app_id is missing")
              keys = [k.get("current_key", "") for k in c.get("api_key", [])]
              if not any(k.startswith("AIza") for k in keys): problems.append("no API key that looks real")
          text = open("google-services.json").read()
          if "your-" in text: problems.append("still contains example placeholders")
          for p in problems: print(f"::error::{p}")
          if problems: sys.exit(1)
          print("OK: valid JSON, project ids present, Android app com.kastra.fleettms with an API key, no placeholders.")
          PY
          rm -f google-services.json
