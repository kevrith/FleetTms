# PostgreSQL settings for point-in-time recovery (masterplan Section 10: lose at most 15 minutes of data, be back within 4 hours).
#
# Every change to the database is written to the write-ahead log (WAL). With archiving on, each finished 16 MB WAL segment is copied to a
# separate location, and a base backup is taken every day. Restoring is: unpack the newest base backup, then replay the archived WAL up to
# the moment wanted (or to the end). Loss on a crash is whatever is in the one WAL segment not yet archived, and archive_timeout
# makes sure a quiet database still closes and ships a segment at least that often. 300 seconds keeps the loss under five minutes,
# a third of the target. Use it as:   postgres -c config_file=... or copy these lines into postgresql.conf, then restart once.
wal_level = replica
archive_mode = on
archive_command = 'test ! -f /backup/wal/%f && cp %p /backup/wal/%f'
archive_timeout = 300
max_wal_senders = 4
# Production should send the archive to storage in another place (a bucket in another region, or another provider), not a folder on the
# same disk: change the archive_command to that tool's own command and keep its failure behaviour (non-zero exit means "try again").
